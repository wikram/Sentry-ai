# DevOps Studio - Ansible Inventory File
[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_user=ansible
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[control_plane]
localhost.internal ansible_connection=local

[webservers]
api-gateway-edge-01.prod.internal ansible_host=10.0.1.15
edge-gateway-eu-central.internal ansible_host=10.0.1.16

[k8s_nodes]
k8s-control-plane-01.prod.internal ansible_host=10.0.2.10
k8s-worker-gpu-04.prod.internal ansible_host=10.0.2.14

[database]
db-postgres-primary.prod.internal ansible_host=10.0.3.50

[staging]
stage-app-worker-01.internal ansible_host=10.0.4.21
