---
- name: CIS Benchmark Level 1 & 2 Security Enforcement
  hosts: localhost
  become: false
  tasks:
    - name: Verify Container Process Execution Non-Root Baseline
      ansible.builtin.command: id -u
      register: current_uid
      changed_when: false

    - name: Audit Workspace Configuration File Permissions
      ansible.builtin.file:
        path: config.xml
        mode: "0644"

    - name: Check Strict TLS & Ingress Routing
      ansible.builtin.debug:
        msg: "Ingress security policy confirmed active on proxy port 3000"
